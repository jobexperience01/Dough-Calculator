      for (let m = 2; m <= 4; m++) {
        targets.push({ balls: fullBalls * m, label: m + " Full Batches" });
        targets.push({ balls: fullBalls * m + halfBalls, label: m + " Full + 1 Half" });
        targets.push({ balls: Math.round(fullBalls * m * 1.5), label: m + " × 1.5 Batch" });
      }

      let best = null;
      let bestScore = 9999;

      targets.forEach(t => {
        if (t.balls <= 0 || t.balls === need) return;
        const diff = Math.abs(t.balls - need);
        const pct = (diff / Math.max(t.balls, need)) * 100;
        if (pct > 20) return;

        const isUp = t.balls > need;
        const score = pct + (isUp ? 0 : 5);

        if (score < bestScore) {
          bestScore = score;
          best = t;
        }
      });

      if (!best) return null;

      const extra = best.balls - need;
      return {
        from: need,
        to: best.balls,
        label: best.label,
        direction: best.balls > need ? "up" : "down",
        pct: ((Math.abs(best.balls - need) / Math.max(best.balls, need)) * 100).toFixed(0),
        extra: extra
      };
    }

    function getRecommendation(need, half, full, weight) {
      if (need <= 0) return { text: "None needed", near: false };

      const neededG = need * weight;
      const halfLow = HALF_G * 0.82, halfHigh = HALF_G * 1.18;
      const fullLow = FULL_G * 0.82, fullHigh = FULL_G * 1.18;
      const oneFiveLow = ONE_FIVE_G * 0.85, oneFiveHigh = ONE_FIVE_G * 1.15;

      if (Math.abs(neededG - HALF_G) < 50) return { text: "Exactly ~1 Half Batch", near: false };
      if (Math.abs(neededG - FULL_G) < 50) return { text: "Exactly ~1 Full Batch", near: false };
      if (Math.abs(neededG - ONE_FIVE_G) < 80) return { text: "Exactly ~1.5 Batch", near: false };

      if (neededG >= halfLow && neededG <= halfHigh)
        return { text: "Near about 1 Half Batch", near: true };
      if (neededG >= fullLow && neededG <= fullHigh)
        return { text: "Near about 1 Full Batch", near: true };
      if (neededG >= oneFiveLow && neededG <= oneFiveHigh)
        return { text: "Near about 1.5 Batch", near: true };

      if (neededG < HALF_G)
        return { text: "Less than Half - make 1 Half Batch", near: false };

      if (neededG > HALF_G && neededG < FULL_G) {
        const distFull = FULL_G - neededG;
        const distHalf = neededG - HALF_G;
        if (distFull <= distHalf) return { text: "Near about 1 Full Batch", near: true };
        return { text: "Near about 1 Half Batch", near: true };
      }

      const fulls = Math.floor(neededG / FULL_G);
      const remG = neededG % FULL_G;
      if (remG < 100) return { text: fulls + " Full Batch" + (fulls > 1 ? "es" : ""), near: false };
      if (remG <= HALF_G * 0.3) return { text: fulls + " Full (almost exact)", near: true };
      if (remG <= HALF_G) return { text: fulls + " Full + 1 Half", near: false };
      return { text: (fulls + 1) + " Full Batch" + (fulls + 1 > 1 ? "es" : ""), near: false };
    }

    function get15Text(need, half, full, weight) {
      if (need <= 0) return "—";
      const neededG = need * weight;
      if (neededG <= HALF_G) return "1 Half Batch";
      if (neededG <= FULL_G) return "1 Full Batch";
      if (neededG <= ONE_FIVE_G) return "1.5 Batch (Full + Half)";
      const n = Math.ceil(neededG / ONE_FIVE_G);
      return n + " × 1.5 Batch";
    }

    // Dough can only be made in whole half-batch steps: 0.5, 1, 1.5, 2 ... batch
    function unitLabel(u) { return (u / 2) + (u === 2 ? " batch" : " batch"); }
    function overallBatchRec(totalG) {
      if (totalG <= 0) return "Nothing to make";
      const u = Math.max(1, Math.round(totalG / UNIT_G));
      return "Closest size: " + unitLabel(u) + " = " + (u * UNIT_G).toLocaleString() + " g";
    }

    function findCleanTotalTarget(totalG) {
      if (totalG <= 0) return null;

      const halfUnits = Math.round(totalG / UNIT_G);
      const candidates = [];
      for (let d = -2; d <= 2; d++) {
        const units = halfUnits + d;
        if (units < 1) continue;
        const targetG = units * UNIT_G;
        const diff = targetG - totalG;
        const pct = Math.abs(diff) / totalG * 100;
        if (pct > 15) continue;

        let label = "";
        if (units % 2 === 0) {
          label = (units / 2) + " Full Batch" + (units / 2 > 1 ? "es" : "");
        } else {
          const fulls = Math.floor(units / 2);
          label = fulls + " Full + 1 Half";
        }
        if (units % 3 === 0) {
          label = (units / 3) + " × 1.5 Batch";
        }

        candidates.push({ targetG, diff, pct, label, units });
      }

      if (candidates.length === 0) return null;

      candidates.sort((a, b) => {
        if (Math.abs(a.diff) !== Math.abs(b.diff)) return Math.abs(a.diff) - Math.abs(b.diff);
        return a.diff - b.diff;
      });

      return candidates[0];
    }

    // ===== Zero-waste packing =====
    // Pan and Handcrafted are packed completely separately (never mixed or converted).
    // Every batch is filled to its capacity (within TOL grams) by choosing exact ball counts,
    // so no half-empty batch with "3 pcs of 12in" is left over at the end.
    const TOL = 30;

    // Pick ball counts (x <= needLeft) whose grams land as close to cap as possible, favouring the
    // highest-priority sizes first (list is already in priority order).
    function fitBatch(list, cap) {
      const n = list.length, maxS = Math.round(cap + TOL);
      const reach = [];
      for (let k = 0; k <= n; k++) reach.push(new Uint8Array(maxS + 1));
      reach[n][0] = 1;
      for (let k = n - 1; k >= 0; k--) {
        const w = list[k].weight, xm = Math.min(list[k].needLeft, Math.floor(maxS / w));
        const nxt = reach[k + 1], cur = reach[k];
        for (let x = 0; x <= xm; x++) {
          const off = x * w;
          for (let t = 0; t + off <= maxS; t++) if (nxt[t]) cur[t + off] = 1;
        }
      }
      let s = -1, bd = 1e9;
      for (let t = Math.max(0, Math.round(cap - TOL)); t <= maxS; t++) {
        if (reach[0][t] && Math.abs(t - cap) < bd) { bd = Math.abs(t - cap); s = t; }
      }
      if (s < 0) { for (let t = Math.round(cap - TOL) - 1; t > 0; t--) if (reach[0][t]) { s = t; break; } }
      const xs = new Array(n).fill(0);
      if (s <= 0) return { xs, g: 0 };
      let rem = s;
      for (let k = 0; k < n; k++) {
        const w = list[k].weight;
        for (let x = Math.min(list[k].needLeft, Math.floor(rem / w)); x >= 0; x--) {
          if (reach[k + 1][rem - x * w]) { xs[k] = x; rem -= x * w; break; }
        }
      }
      return { xs, g: s };
    }

    // Last batch: choose final counts that fill exactly `cap`, changing as few balls as possible
    // (cuts or adds). Sizes with no need can be added, so the dough is always fully used.
    function adjustLast(list, cap, tol) {
      tol = tol || TOL;
      const n = list.length, maxS = Math.round(cap + tol), minS = Math.max(1, Math.round(cap - tol)), ADD = 14;
      let cur = new Float64Array(maxS + 1).fill(Infinity); cur[0] = 0;
      const choice = [];
      for (let k = 0; k < n; k++) {
        const it = list[k], w = it.weight, r = it.needLeft;
        const xm = Math.min(r + ADD, Math.floor(maxS / w));
        const ch = new Int16Array(maxS + 1), nb = new Float64Array(maxS + 1).fill(Infinity);
        const cost = x => { const d = x - r; return d > 0 ? d * 1000 + d * Math.min(it.leftover, 300) * 0.5 : -d * 1000 + -d * Math.max(0, 40 - it.leftover); };
        for (let t = 0; t <= maxS; t++) {
          if (cur[t] === Infinity) continue;
          for (let x = 0; x <= xm; x++) {
            const ns = t + x * w; if (ns > maxS) break;
            const c = cur[t] + cost(x);
            if (c < nb[ns]) { nb[ns] = c; ch[ns] = x; }
          }
        }
        choice.push(ch); cur = nb;
      }
      let s = -1, bs = Infinity;
      for (let t = minS; t <= maxS; t++) { const sc = cur[t] + Math.abs(t - cap); if (sc < bs) { bs = sc; s = t; } }
      if (s < 0 || bs === Infinity) return null;
      const xs = new Array(n).fill(0); let rem = s;
      for (let k = n - 1; k >= 0; k--) { xs[k] = choice[k][rem]; rem -= xs[k] * list[k].weight; }
      return { xs, g: s };
    }

    function makePool(items) {
      return items.map(it => ({ short: it.short, name: it.name, key: it.key, weight: it.weight, needLeft: Math.max(0, it.need || 0), leftover: it.leftover || 0 }));
    }
    // Split u half-batch units into batches no bigger than the selected batch size; the smaller one goes last.
    function capsFor(u) { const per = Math.max(1, Math.round(BATCH_M * 2)), c = []; let r = u; while (r > 0) { const k = Math.min(per, r); c.push(k * UNIT_G); r -= k; } return c; }

    // Shared batch loop. caps = planned capacity per batch (null = decide as we go).
    // adjustLastBatch = true lets the last batch change counts (smart adjust).
    function runPlan(pool, capFull, caps, adjustLastBatch) {
      const batches = [], produced = {}, changes = {};
      const stock = it => (it.leftover || 0) + (produced[it.short] || 0);
      function prioritySort(list, isFirst) {
        list.sort((a, b) => {
          if (isFirst) {
            const aLow = a.leftover < cutOfShort(a.short).c ? 0 : 1, bLow = b.leftover < cutOfShort(b.short).c ? 0 : 1;
            if (aLow !== bLow) return aLow - bLow;
            return a.leftover - b.leftover || b.needLeft - a.needLeft;
          }
          const aU = stock(a) < cutOfShort(a.short).w ? 0 : 1, bU = stock(b) < cutOfShort(b.short).w ? 0 : 1;
          if (aU !== bU) return aU - bU;
          return stock(a) - stock(b) || b.needLeft - a.needLeft;
        });
      }
      const totalLeft = () => pool.reduce((t, it) => t + it.needLeft * it.weight, 0);
      let j = 0, used = 0, ok = true;
      while (pool.some(it => it.needLeft > 0) || (adjustLastBatch && caps && j < caps.length)) {
        prioritySort(pool, j === 0);
        const remG = totalLeft();
        const capJ = caps ? (j < caps.length ? caps[j] : capFull) : capFull;
        const isLast = caps ? j >= caps.length - 1 : remG <= capFull + TOL;
        let xs, consume;
        const addCh = (it, d) => { if (d) changes[it.key || it.short] = (changes[it.key || it.short] || 0) + d; };
        const solve = (list, cap) => adjustLast(list, cap) || adjustLast(list, cap, 60) || adjustLast(list, cap, 100);
        if (isLast && adjustLastBatch) {
          const r = solve(pool, Math.max(1, caps.reduce((a, c) => a + c, 0) - used));
          if (!r) { ok = false; break; }
          xs = r.xs; consume = xs.slice();
          pool.forEach((it, k) => addCh(it, xs[k] - it.needLeft));
          pool.forEach((it, k) => { it.needLeft = xs[k]; });
        } else if (isLast) {
          xs = pool.map(it => it.needLeft); consume = xs.slice();
        } else {
          const f = fitBatch(pool, capJ);
          xs = f.xs; consume = xs.slice();
          if (adjustLastBatch && Math.abs(f.g - capJ) > TOL) {
            // this batch cannot be filled from the counts we have: top it up with a few extra pieces
            const sub = pool.map((it, k) => ({ ...it, needLeft: f.xs[k] }));
            const r = solve(sub, capJ);
            if (!r) { ok = false; break; }
            xs = r.xs;
            pool.forEach((it, k) => { addCh(it, Math.max(0, xs[k] - f.xs[k])); consume[k] = Math.min(xs[k], f.xs[k]); });
          }
        }
        const batch = [];
        pool.forEach((it, k) => {
          if (xs[k] > 0) { batch.push({ short: it.short, balls: xs[k], grams: xs[k] * it.weight }); produced[it.short] = (produced[it.short] || 0) + xs[k]; it.needLeft -= consume[k]; }
        });
        if (!batch.length) { if (isLast) break; const it = pool.find(p => p.needLeft > 0); if (!it) break; batch.push({ short: it.short, balls: it.needLeft, grams: it.needLeft * it.weight }); produced[it.short] = (produced[it.short] || 0) + it.needLeft; it.needLeft = 0; }
        used += batch.reduce((t, x) => t + x.grams, 0);
        batches.push(batch); j++;
        if (isLast) break;
        if (j > 40) break;
      }
      return { batches, changes, ok };
    }

    // Normal packing for the counts entered. If the total sits on a clean half-batch multiple,
    // every batch is planned to fill exactly (fulls first, a half last if needed).
    function packIntoBatches(items, capacityUnits) {
      const pool = makePool(items.filter(it => it.need > 0 && it.weight > 0));
      const T = pool.reduce((t, it) => t + it.needLeft * it.weight, 0);
      if (T <= 0) return [];
      let u = Math.round(T / UNIT_G);
      if (u < 1 || Math.abs(T - u * UNIT_G) > 60) u = Math.max(1, Math.ceil(T / UNIT_G));
      return runPlan(pool, FULL_G, capsFor(u), false).batches;
    }

    // A plan is "clean" when every batch is full and the last is a full or half batch.
    function isCleanPlan(batches) {
      if (!batches.length) return true;
      const g = batches.map(b => b.reduce((t, x) => t + x.grams, 0));
      for (let i = 0; i < g.length - 1; i++) if (Math.abs(g[i] - FULL_G) > 70) return false;
      const last = g[g.length - 1], k = Math.round(last / UNIT_G);
      return k >= 1 && Math.abs(last - k * UNIT_G) <= 70;
    }

    function processGroup(sizeList) {
      setGroup(sizeList === hcSizes);
      const results = [];
      let totalGrams = 0;

      sizeList.forEach(s => {
        const leftover = getVal("left-" + s.key);
        const today = getVal("need-" + s.key);
        const need = Math.max(0, today - leftover);
        const grams = need * s.weight;
        const rec = getRecommendation(need, s.half, s.full, s.weight);
        const opt15 = get15Text(need, s.half, s.full, s.weight);
        const adjust = suggestAdjust(need, s.weight, Math.round(s.half * BATCH_M), Math.round(s.full * BATCH_M));

        totalGrams += grams;

        results.push({
          ...s, leftover, today, need, grams, rec, opt15, adjust
        });
      });

      return {
        results: results.filter(r => r.need > 0 || r.today > 0 || r.leftover > 0),
        all: results,
        withNeed: results.filter(r => r.need > 0),
        totalG: totalGrams
      };
    }

    function buildResultCards(results, isHc) {
      return results.map(r => {
        let tip = "";
        if (r.adjust) {
          tip = r.adjust.extra > 0
            ? `<div class="tip">Add ${r.adjust.extra} more (to ${r.adjust.to}) to fill ${r.adjust.label}, +${r.adjust.pct}%</div>`
            : `<div class="tip">Cut ${Math.abs(r.adjust.extra)} (to ${r.adjust.to}) for a clean ${r.adjust.label}, −${r.adjust.pct}%</div>`;
        }
        return `<div class="item">
          <div class="item-top">
            <div><div class="nm">${r.name}</div><div class="sub"><span>Projected ${r.today}</span><span>Leftover ${r.leftover}</span></div></div>
            <div class="make"><b>${r.need}</b><span>To make</span></div>
          </div>
          <div class="meta"><span class="pill ${r.rec.near ? "near" : ""}">${r.rec.text}</span><span class="g">${r.grams.toLocaleString()} g</span></div>
          ${tip}
        </div>`;
      }).join("");
    }

    function batchCards(batches, cap, key) {
      return batches.map((b, i) => {
        const g = b.reduce((s, x) => s + x.grams, 0);
        const sz = Math.min(cap, Math.max(1, Math.ceil((g - TOL) / UNIT_G)) * UNIT_G), p = Math.min(100, Math.round(g / sz * 100));
        const chk = key ? `<button class="bdone" onclick="toggleBatch('${key}',${i})" aria-label="Mark batch ${i + 1} made"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></button>` : "";
        return `<div class="batch" data-b="${key || ""}${i}">
          <div class="bhead"><div class="bh" style="flex:1;margin:0"><b>Batch ${i + 1}</b><span>${g.toLocaleString()} of ${sz.toLocaleString()} g (${sz / UNIT_G / 2} batch), ${p}% full</span></div>${chk}</div>
          <div class="chips" style="margin-top:9px">${b.map(x => `<span class="chip"><b>${x.short}</b>${x.balls} ${x.balls === 1 ? "ball" : "balls"}</span>`).join("")}</div>
          <div class="mrdline"><em>MRD</em>${mrdFor(b).map(m => `<span class="chip m"><b>${m.short}</b>${m.mrd}</span>`).join("")}</div>
          <div class="bar2"><i style="width:${p}%"></i></div>
        </div>`;
      }).join("");
    }

    function mrdHtml(batches) {
      const t = mrdTotals(batches);
      if (!t.rows.length) return "";
      return `<details open><summary>MRD to print <em>${t.total} total</em></summary>
        <div class="mrdnote">Total across all ${batches.length} ${batches.length === 1 ? "batch" : "batches"}. Each batch's MRD are listed on its card above.</div>
        ${t.rows.map(r => `<div class="mrdrow"><div><b>${r.short}</b><span>${r.pcs} pcs, ${r.cap} per MRD</span></div><b>${r.mrd}</b></div>`).join("")}
      </details>`;
    }

    function buildSequenceHtml(withNeed, isHc) {
      if (withNeed.length === 0) return "";
      const sorted = withNeed.slice().sort((a, b) => {
        const aLow = a.leftover < cutOfShort(a.short).c ? 0 : 1;
        const bLow = b.leftover < cutOfShort(b.short).c ? 0 : 1;
        if (aLow !== bLow) return aLow - bLow;
        return a.leftover - b.leftover || a.need - b.need;
      });
      const single = packIntoBatches(sorted, 1.0);
      const key = isHc ? "hc" : "pan";
      return boardHtml(key, withNeed, single) + "<!--SEQ-->" + `<div class="seq">
        <h3>Batches</h3>
        <p class="hint">${(() => { const t = cutUni(withNeed.map(r => cutOf(r.key))); return t.u ? `Sizes with under ${t.c} leftover go first. Later batches favor sizes under ${t.w}.` : "Sizes below their Make first level go first. Later batches favor sizes below their Priority level."; })()}</p>
        <details open><summary>Make list <em id="bp-${isHc ? "hc" : "pan"}">0 of ${single.length} made</em></summary>${batchCards(single, FULL_G, isHc ? "hc" : "pan")}</details>
        ${mrdHtml(single)}
      </div>`;
    }

    function typeSection(label, cls, d, isHc) {
      setGroup(isHc);
      if (!d.results.length) return "";
      const ct = findCleanTotalTarget(d.totalG);
      let target = "";
      if (ct && Math.abs(ct.diff) > 50) {
        const act = ct.diff < 0 ? `Reduce by ${Math.abs(ct.diff).toLocaleString()} g` : `Add ${ct.diff.toLocaleString()} g`;
        target = `<div class="target"><div><b>Clean target: ${ct.targetG.toLocaleString()} g</b><span>${ct.label}</span></div><em>${act}</em></div>`;
      }
      const seqParts = buildSequenceHtml(d.withNeed, isHc).split("<!--SEQ-->");
      return `<section class="type ${cls}">
        <h2><i></i>${label}</h2>
        <div class="hero">
          <div class="hero-k">Production required</div>
          <div class="hero-v">${d.totalG.toLocaleString()}<small> g</small></div>
          <div class="hero-s">${(d.totalG / FULL_G).toFixed(2)} batches of ${FULL_G.toLocaleString()} g. ${overallBatchRec(d.totalG)}.</div>
          ${tanks(d.totalG)}
        </div>
        ${suggestHtml(isHc ? "hc" : "pan", d)}
        ${seqParts[0]}
        <div class="items">${buildResultCards(d.results, isHc)}</div>
        ${seqParts[1] || ""}
      </section>`;
    }

    const suggs = {};

    // Smart adjust: "cut the coat to fit the cloth". For the nearest full/half batch totals below and
    // above, fill every batch exactly and change as few balls as possible in the last batch
    // (cut a few pieces, or add a few) so the last batch is exactly full or exactly half. No dough is left over.
    function buildSuggestions(d) {
      const total = d.totalG, out = [];
      if (total <= 0) return out;
      const us = new Set([Math.ceil(total / UNIT_G), Math.floor(total / UNIT_G)]);
      [...us].filter(u => u >= 1).forEach(u => {
        const pool = makePool(d.all.map(z => ({ short: z.short, key: z.key, name: z.name, weight: z.weight, need: z.need, leftover: z.leftover })));
        const run = runPlan(pool, FULL_G, capsFor(u), true);
        if (!run.ok) return;
        const changes = d.all.map(z => ({ key: z.key, short: z.short, delta: run.changes[z.key] || 0 })).filter(c => c.delta);
        if (!changes.length) return;
        const nChg = changes.reduce((t, c) => t + Math.abs(c.delta), 0);
        if (nChg > 40) return;
        const gotG = total + changes.reduce((t, c) => t + c.delta * d.all.find(z => z.key === c.key).weight, 0);
        // verify: re-pack the adjusted counts the way the plan page will
        const sim = d.all.map(z => { const c = changes.find(x => x.key === z.key); return { ...z, need: Math.max(0, z.need + (c ? c.delta : 0)) }; }).filter(z => z.need > 0);
        const verified = isCleanPlan(packIntoBatches(sim, 1.0));
        out.push({ dir: gotG > total ? 1 : -1, changes, gotG, off: Math.round(Math.abs(gotG - u * UNIT_G)), batches: u / 2, units: u, targetG: u * UNIT_G, verified, nChg });
      });
      out.sort((a, b) => (b.verified - a.verified) || (a.nChg - b.nChg));
      return out;
    }

    const adjHist = { undo: [], redo: [] };
    function resetAdj() { adjHist.undo = []; adjHist.redo = []; }
    const snapNeeds = () => { const o = {}; allSizes.forEach(z => o[z.key] = $("need-" + z.key).value); return o; };
    const setNeeds = o => Object.keys(o).forEach(k => $("need-" + k).value = o[k]);
    function rerenderPlan() {
      refreshUI();
      const st = $("sheetBody").scrollTop;
      calculate();
      $("sheetBody").scrollTop = st;
    }
    function adjBar() {
      if (!adjHist.undo.length && !adjHist.redo.length) return "";
      return `<div class="adjbar"><button type="button" onclick="undoAdjust()" ${adjHist.undo.length ? "" : "disabled"}>↶ Undo</button><button type="button" onclick="redoAdjust()" ${adjHist.redo.length ? "" : "disabled"}>↷ Redo</button></div>`;
    }

    function suggestHtml(key, d) {
      setGroup(key === "hc");
      const head = `<div class="sugg-h"><span class="spark"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg></span><div><b>Smart adjust</b><small>Cut or add a few pieces so no dough is wasted</small></div></div>`;
      const bar = adjBar();
      const cleanNow = isCleanPlan(packIntoBatches(d.withNeed, 1.0)) && Math.abs(d.totalG - Math.round(d.totalG / UNIT_G) * UNIT_G) <= 70;
      if (cleanNow) {
        suggs[key] = [];
        return `<div class="sugg">${head}${bar}<div class="okline"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Already a clean batch. No dough left over.</div></div>`;
      }
      const list = suggs[key] = buildSuggestions(d);
      if (!list.length) return bar ? `<div class="sugg">${head}${bar}</div>` : "";
      return `<div class="sugg">${head}${bar}${list.map((s, i) => {
        const adds = s.changes.filter(c => c.delta > 0).reduce((a, c) => a + c.delta, 0);
        const cuts = -s.changes.filter(c => c.delta < 0).reduce((a, c) => a + c.delta, 0);
        const title = adds && cuts ? `Cut ${cuts} and add ${adds}` : adds ? `Add ${adds} ${adds === 1 ? "ball" : "balls"}` : `Cut ${cuts} ${cuts === 1 ? "ball" : "balls"}`;
        return `
        <div class="oc">
          <div class="oc-top">
            <div><b>${title}</b><span>${i === 0 ? "Closest. " : ""}${s.dir > 0 ? "Add dough, make" : "Cut dough, make"} ${s.batches} batch = ${s.targetG.toLocaleString()} g${s.verified ? "" : " (closest fit)"}</span></div>
            <div class="oc-res"><b>${Math.round(s.gotG).toLocaleString()} g</b><span>${s.off ? "within " + s.off.toLocaleString() + " g" : "exact"}</span></div>
          </div>
          <div class="dchips">${s.changes.map(c => `<span class="dchip ${c.delta > 0 ? "up" : "dn"}">${c.delta > 0 ? "+" : "−"}${Math.abs(c.delta)} ${c.short}</span>`).join("")}</div>
          <button class="btn ${i ? "ghost" : "primary"}" onclick="applySuggestion('${key}',${i})">Apply and recalculate</button>
        </div>`; }).join("")}</div>`;
    }

    function applySuggestion(key, i) {
      const s = (suggs[key] || [])[i];
      if (!s) return;
      const before = snapNeeds();
      s.changes.forEach(c => {
        const left = getVal("left-" + c.key), need = Math.max(0, getVal("need-" + c.key) - left);
        $("need-" + c.key).value = (left + Math.max(0, need + c.delta)) || "";
      });
      adjHist.undo.push({ before, after: snapNeeds() });
      adjHist.redo = [];
      rerenderPlan();
      toastAction("Projected counts adjusted", "Undo", undoAdjust);
    }
    function undoAdjust() {
      const h = adjHist.undo.pop();
      if (!h) return;
      setNeeds(h.before); adjHist.redo.push(h); rerenderPlan();
    }
    function redoAdjust() {
      const h = adjHist.redo.pop();
      if (!h) return;
      setNeeds(h.after); adjHist.undo.push(h); rerenderPlan();
    }
    function toastAction(msg, label, fn) {
      const t = $("toast");
      t.innerHTML = `${msg}<button type="button">${label}</button>`;
      t.querySelector("button").onclick = () => { fn(); t.classList.remove("show", "act"); };
      t.classList.add("show", "act");
      clearTimeout(toast.t);
      toast.t = setTimeout(() => t.classList.remove("show", "act"), 6000);
    }

    const boards = {}, doneN = { pan: 0, hc: 0 };
    let lastTotals = { pan: 0, hc: 0 };
    const ROW = 58;

    function tanks(totalG) {
      const n = Math.min(8, Math.max(1, Math.ceil(totalG / FULL_G - 0.0001)));
      return `<div class="tanks">` + Array.from({ length: n }, (_, i) => {
        const f = Math.min(1, Math.max(0, (totalG - i * FULL_G) / FULL_G));
        return `<div class="tank"><i style="--f:${(f * 100).toFixed(0)}%"></i><span>${Math.round(f * 100)}%</span></div>`;
      }).join("") + `</div>`;
    }

    function boardHtml(key, withNeed, batches) {
      const rows = withNeed.map(r => ({ short: r.short, name: r.name, stocks: [r.leftover], ...cutOfShort(r.short) }));
      const prod = {};
      batches.forEach(b => {
        b.forEach(x => prod[x.short] = (prod[x.short] || 0) + x.balls);
        rows.forEach(rw => rw.stocks.push(rw.stocks[0] + (prod[rw.short] || 0)));
      });
      const max = Math.ceil(Math.max(30, ...rows.flatMap(r => r.stocks), ...rows.map(r => r.w + 10)) / 10) * 10;
      const uni = cutUni(rows);
      boards[key] = { rows, batches, max, stage: 0, timer: null };
      const pc = v => (v / max * 100).toFixed(2) + "%";
      const stages = ["Now", ...batches.map((_, i) => "After batch " + (i + 1))];
      return `<div class="board" id="board-${key}">
        <div class="board-top">
          <div><div class="stage-t" id="st-${key}"></div><div class="stage-s" id="ss-${key}"></div></div>
          <button class="play" onclick="playBoard('${key}')"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>Play</button>
        </div>
        <div class="scale"><div>${uni.u ? `<span class="s10" style="left:${pc(uni.c)}">${uni.c}</span><span class="s20" style="left:${pc(uni.w)}">${uni.w}</span>` : ""}</div><div></div></div>
        <div class="prows" style="height:${rows.length * ROW}px">${rows.map((r, i) => `
          <div class="prow" data-i="${i}">
            <div class="pt"><span class="pl">${r.name}</span><span class="pb"></span></div>
            <div class="pm"><div class="ptrack"><i class="tick a" style="left:${pc(r.c)}"></i><i class="tick b" style="left:${pc(r.w)}"></i><b class="fill"></b></div><span class="pv"></span></div>
          </div>`).join("")}</div>
        <div class="stagechips">${stages.map((s, i) => `<button data-k="${i}" onclick="setStage('${key}',${i})">${s}</button>`).join("")}</div>
        <div class="nextmake" id="nm-${key}"></div>
      </div>`;
    }

    function updateBoard(key, stage) {
      const B = boards[key];
      if (!B) return;
      B.stage = stage;
      const n = B.batches.length;
      const root = $("board-" + key);
      const uni = cutUni(B.rows);
      const order = B.rows.map((r, i) => ({ i, s: r.stocks[stage], c: r.c, w: r.w })).sort((a, b) => {
        const au = a.s < a.c ? 0 : 1, bu = b.s < b.c ? 0 : 1;
        return au - bu || a.s - b.s || a.i - b.i;
      });
      let crit = 0, warn = 0;
      order.forEach((o, rank) => {
        const el = root.querySelector(`.prow[data-i="${o.i}"]`);
        const z = o.s < o.c ? "z-c" : o.s < o.w ? "z-w" : "z-ok";
        if (z === "z-c") crit++; else if (z === "z-w") warn++;
        el.className = "prow " + z;
        el.style.transform = `translateY(${rank * ROW}px)`;
        el.querySelector(".fill").style.width = Math.min(100, o.s / B.max * 100) + "%";
        el.querySelector(".pv").textContent = o.s;
        el.querySelector(".pb").textContent = z === "z-c" ? "Make first" : z === "z-w" ? "Priority" : "Stocked";
      });
      $("st-" + key).textContent = stage === 0 ? "Right now" : "After batch " + stage;
      $("ss-" + key).textContent = stage >= n ? "All batches made. Every size is at the projected count."
        : crit ? `${crit} ${crit > 1 ? "sizes are" : "size is"} ${uni.u ? "under " + uni.c : "below the Make first level"}. Batch ${stage + 1} starts with ${crit > 1 ? "them" : "it"}.`
        : warn ? `Nothing urgent. ${warn} ${warn > 1 ? "sizes" : "size"} ${uni.u ? "under " + uni.w : "below the Priority level"} lead batch ${stage + 1}.`
        : (uni.u ? `Every size is at ${uni.w} or more.` : "Every size is stocked.");
      root.querySelectorAll(".stagechips button").forEach(b => b.classList.toggle("on", Number(b.dataset.k) === stage));
      $("nm-" + key).innerHTML = stage >= n ? "" : `<b>Batch ${stage + 1} makes</b>` + B.batches[stage].map(x => `<span class="chip"><b>${x.short}</b>${x.balls}</span>`).join("");
    }

    function setStage(key, k) { clearInterval(boards[key].timer); updateBoard(key, k); }
    function playBoard(key) {
      const B = boards[key];
      clearInterval(B.timer);
      let k = 0;
      updateBoard(key, 0);
      B.timer = setInterval(() => {
        k++;
        if (k > B.batches.length) { clearInterval(B.timer); return; }
        updateBoard(key, k);
      }, 1700);
    }
    function toggleBatch(key, i) {
      const B = boards[key];
      doneN[key] = i < doneN[key] ? i : i + 1;
      document.querySelectorAll(`.batch[data-b^="${key}"]`).forEach(el => {
        const idx = Number(el.dataset.b.slice(key.length));
        el.classList.toggle("done", idx < doneN[key]);
      });
      $("bp-" + key).textContent = `${doneN[key]} of ${B.batches.length} made`;
      setStage(key, doneN[key]);
      if (navigator.vibrate) navigator.vibrate(10);
    }

    function sharePlan() {
      const lines = ["Dough plan, " + new Date().toLocaleDateString(), "Batch size: " + BATCH_M + "x (Pan " + Math.round(BASE_G * BATCH_M).toLocaleString() + " g, HC " + Math.round(HC_BASE_G * BATCH_M).toLocaleString() + " g)"];
      [["pan", "Pan"], ["hc", "Handcrafted"]].forEach(([k, label]) => {
        const B = boards[k];
        if (!B) return;
        lines.push("", label + ": " + (lastTotals[k] / 1000).toFixed(2) + " kg");
        B.batches.forEach((b, i) => lines.push("Batch " + (i + 1) + ": " + b.map(x => x.short + " x" + x.balls).join(", ") + " | MRD " + mrdFor(b).map(m => m.short + " x" + m.mrd).join(", ")));
        const mt = mrdTotals(B.batches);
        lines.push("MRD total (" + mt.total + "): " + mt.rows.map(r => r.short + " x" + r.mrd).join(", "));
      });
      const text = lines.join("\n");
      if (navigator.share) navigator.share({ title: "Dough plan", text }).catch(() => {});
      else if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast("Plan copied"));
    }

    function calculate() {
      const pan = processGroup(panSizes);
      const hc = processGroup(hcSizes);

      lastPanResults = pan.results;
      lastHcResults = hc.results;
      lastPanTotalG = pan.totalG;
      lastHcTotalG = hc.totalG;

      if (!pan.results.length && !hc.results.length) {
        toast("Enter at least one count");
        return;
      }

      const inputs = {};
      allSizes.forEach(s => {
        inputs["left-" + s.key] = $("left-" + s.key).value;
        inputs["need-" + s.key] = $("need-" + s.key).value;
      });
      lastInputs = inputs;
      saveToHistory({ date: todayKey(), panTotalG: pan.totalG, hcTotalG: hc.totalG, inputs, batch: BATCH_M });

      Object.keys(boards).forEach(k => { clearInterval(boards[k].timer); delete boards[k]; });
      doneN.pan = doneN.hc = 0;
      lastTotals = { pan: pan.totalG, hc: hc.totalG };
      let html = "";
      html += typeSection("Pan dough", "pan", pan, false) + typeSection("Handcrafted dough", "hc", hc, true);
      $("sheetBody").innerHTML = html;
      Object.keys(boards).forEach(k => updateBoard(k, 0));
      openSheet("results", "Production plan");
    }

    function clearAll() {
      resetAdj();
      allSizes.forEach(s => {
        $("left-" + s.key).value = "";
        $("need-" + s.key).value = "";
      });
      lastPanResults = [];
      lastHcResults = [];
      lastPanTotalG = 0;
      lastHcTotalG = 0;
      refreshUI();
      closeSheet();
    }

    function setBatch(m) {
      applyBatch(m);
      $("bseg").value = String(m);
      $("bselG").textContent = "Pan " + Math.round(BASE_G * m).toLocaleString() + " g, HC " + Math.round(HC_BASE_G * m).toLocaleString() + " g per batch";
      refreshUI();
    }

    function refreshUI() {
      document.querySelectorAll(".fld").forEach(f => {
        f.classList.toggle("has", (parseInt(f.querySelector("input").value) || 0) > 0);
      });
      document.querySelectorAll('input[id^="left-"]').forEach(inp => {
        const f = inp.closest(".fld"), v = inp.value === "" ? null : parseInt(inp.value);
        const t = cutOf(inp.id.slice(5));
        f.classList.toggle("lowc", v !== null && v < t.c);
        f.classList.toggle("loww", v !== null && v >= t.c && v < t.w);
      });
      const tot = list => list.reduce((s, z) => s + Math.max(0, getVal("need-" + z.key) - getVal("left-" + z.key)) * z.weight, 0);
      const pg = tot(panSizes), hg = tot(hcSizes);
      const chip = (n, g, c) => g > 0 ? `<span style="--c:${c}">${n} <b>${(g / 1000).toFixed(2)} kg</b> ${(g / (c.includes("hc") ? HC_BASE_G : BASE_G) / BATCH_M).toFixed(2)} batch</span>` : "";
      $("live").innerHTML = chip("Pan", pg, "var(--pan)") + chip("Handcrafted", hg, "var(--hc)");
      $("live").classList.toggle("on", pg + hg > 0);
      const any = list => list.some(s => getVal("left-" + s.key) > 0 || getVal("need-" + s.key) > 0);
      document.querySelector('[data-t="pan"]').classList.toggle("dot", any(panSizes));
      document.querySelector('[data-t="hc"]').classList.toggle("dot", any(hcSizes));
    }

    /**
     * Draws ONE combined priority bar graph into a jsPDF document, but with two
     * clearly separated areas inside it — a PAN section and a HANDCRAFTED section.
     * Each section keeps its own row numbering (1, 2, 3...) since production
     * sequences for pan and handcrafted dough are made independently.
     *
     * @param {jsPDF} doc      - the jsPDF document instance
     * @param {number} startY  - y position (mm) to start drawing at
     * @param {Array} panItems - pan items, each { short, leftover, need, grams }
     * @param {Array} hcItems  - handcrafted items, same shape
     * @param {number} pageWidth - full page width in mm
     * @param {number} margin - page margin in mm (used for left/right box edges)
     * @returns {number} new y position after the graph
     */
    function drawCombinedPriorityGraph(doc, startY, panItems, hcItems, pageWidth, margin) {
      const pan = panItems || [];
      const hc = hcItems || [];
      if (pan.length === 0 && hc.length === 0) return startY;

      const boxX = margin;
      const boxW = pageWidth - margin * 2;
      const rowH = 6.5;

      // Compute total box height: title + subtitle + (section label + rows) x2 + gap + legend
      const sectionGap = (pan.length > 0 && hc.length > 0) ? 3.5 : 0;
      let boxH = 5 + 4 + 3; // top pad + title + subtitle
      if (pan.length > 0) boxH += 5 + pan.length * rowH;
      boxH += sectionGap;
      if (hc.length > 0) boxH += 5 + hc.length * rowH;
      boxH += 7; // legend + bottom pad

      let y = startY;

      // Outer box
      doc.setDrawColor(100, 100, 100);
      doc.setLineWidth(0.4);
      doc.setFillColor(250, 250, 250);
      doc.roundedRect(boxX, y, boxW, boxH, 2, 2, "FD");

      let iy = y + 5;

      // Title
      doc.setFontSize(9);
      doc.setTextColor(40);
      doc.setFont(undefined, "bold");
      doc.text("Priority order (make first to last)", boxX + 3, iy);
      iy += 3.5;

      // Subtitle
      doc.setFontSize(6);
      doc.setTextColor(120);
      doc.setFont(undefined, "normal");
      const cu = cutUni([...pan, ...hc].map(r => cutOfShort(r.short)));
      doc.text((cu.u ? "Red = leftover < " + cu.c + " (urgent)" : "Red = leftover below its Make first level (urgent)") + "  |  Longer bar = more leftover (lower priority)", boxX + 3, iy);
      iy += 4.5;

      const maxLeft = Math.max(...pan.map(r => r.leftover), ...hc.map(r => r.leftover), 10);
      const labelW = 24;
      const chartLeft = boxX + 3 + labelW;
      const chartW = boxW - labelW - 55;

      function drawSectionRows(items, sectionLabel, sectionColor) {
        // Section divider label
        doc.setFontSize(7);
        doc.setTextColor(sectionColor[0], sectionColor[1], sectionColor[2]);
        doc.setFont(undefined, "bold");
        doc.text(sectionLabel, boxX + 3, iy);
        // thin divider line to the right of the label
        doc.setDrawColor(sectionColor[0], sectionColor[1], sectionColor[2]);
        doc.setLineWidth(0.3);
        doc.line(boxX + 3 + doc.getTextWidth(sectionLabel) + 2, iy - 1.2, boxX + boxW - 3, iy - 1.2);
        iy += 4;

        items.forEach((r, idx) => {
          const barW = Math.max(2, (r.leftover / maxLeft) * chartW);

          const rt = cutOfShort(r.short);
          if (r.leftover < rt.c) {
            doc.setFillColor(244, 67, 54);
          } else if (r.leftover < rt.w) {
            doc.setFillColor(255, 152, 0);
          } else {
            doc.setFillColor(66, 165, 245);
          }
          doc.roundedRect(chartLeft, iy, barW, 4.5, 1, 1, "F");

          doc.setFontSize(7);
          doc.setTextColor(40);
          doc.setFont(undefined, "bold");
          doc.text(r.short, boxX + 3, iy + 3.3);

          doc.setFont(undefined, "normal");
          doc.setFontSize(6);
          doc.setTextColor(60);
          const valX = Math.min(chartLeft + barW + 2, boxX + boxW - 48);
          doc.text("Left " + r.leftover + " | Need " + r.need + " | " + r.grams.toLocaleString() + "g", valX, iy + 3.3);

          iy += rowH;
        });
      }

      if (pan.length > 0) drawSectionRows(pan, "PAN DOUGH", [255, 107, 53]);
      if (pan.length > 0 && hc.length > 0) iy += 3.5; // clear gap so HC label isn't crowded against Pan's bars
      if (hc.length > 0) drawSectionRows(hc, "HANDCRAFTED DOUGH", [46, 125, 50]);

      // Legend
      iy += 1;
      doc.setFillColor(244, 67, 54); doc.rect(boxX + 3, iy, 3.5, 3, "F");
      doc.setFontSize(6); doc.setTextColor(60);
      doc.text(cu.u ? "Urgent (<" + cu.c + " left)" : "Urgent (Make first)", boxX + 8, iy + 2.4);

      doc.setFillColor(255, 152, 0); doc.rect(boxX + 48, iy, 3.5, 3, "F");
      doc.text(cu.u ? "Watch (<" + cu.w + " left)" : "Watch (Priority)", boxX + 53, iy + 2.4);

      doc.setFillColor(66, 165, 245); doc.rect(boxX + 95, iy, 3.5, 3, "F");
      doc.text(cu.u ? "OK (" + cu.w + "+ left)" : "OK (Stocked)", boxX + 100, iy + 2.4);

      return y + boxH + 3;
    }

    function downloadPDF() {
      if ((!lastPanResults || lastPanResults.length === 0) && (!lastHcResults || lastHcResults.length === 0)) return;
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
      const MARGIN = 25.4; // 1 inch on every side
      const W = doc.internal.pageSize.getWidth();
      const H = doc.internal.pageSize.getHeight();
      const now = new Date();
      let y = MARGIN;

      // Header
      doc.setFontSize(13);
      doc.setTextColor(255, 107, 53);
      doc.setFont(undefined, "bold");
      doc.text("Dough Production Sheet", W / 2, y, { align: "center" });
      y += 5;
      doc.setFontSize(7);
      doc.setTextColor(100);
      doc.setFont(undefined, "normal");
      doc.text(now.toLocaleDateString() + " " + now.toLocaleTimeString() + "  |  Batch size " + BATCH_M + "x = Pan " + Math.round(BASE_G * BATCH_M).toLocaleString() + " g / HC " + Math.round(HC_BASE_G * BATCH_M).toLocaleString() + " g  |  Pan and HC planned separately", W / 2, y, { align: "center" });
      y += 6;

      const adjText = r => !r.adjust ? "—" : (r.adjust.extra > 0 ? "Add " + r.adjust.extra + " to " + r.adjust.to : "Cut " + Math.abs(r.adjust.extra) + " to " + r.adjust.to);
      function drawTable(list, tag, color) {
        doc.autoTable({
          startY: y,
          head: [["Type","Size","Today","Left","Need","Grams","Recommendation","Adjust"]],
          body: list.map(r => [tag, r.short, String(r.today), String(r.leftover), String(r.need), r.grams.toLocaleString() + "g", r.rec.text, adjText(r)]),
          theme: "grid",
          styles: { fontSize: 6.3, cellPadding: 1.1, overflow: "linebreak", valign: "middle" },
          headStyles: { fillColor: color, textColor: 255, fontStyle: "bold", fontSize: 6.3 },
          columnStyles: { 0: { cellWidth: 12 }, 1: { cellWidth: 17 }, 2: { cellWidth: 11 }, 3: { cellWidth: 10 }, 4: { cellWidth: 11 }, 5: { cellWidth: 17 }, 6: { cellWidth: 45 }, 7: { cellWidth: 36.2 } },
          margin: { left: MARGIN, right: MARGIN, top: MARGIN, bottom: MARGIN }
        });
        y = doc.lastAutoTable.finalY + 3;
      }

      // Helper to draw a total bar (kept separate per type since totals are distinct)
      function drawTotalBox(totalG, label, rgb) {
        if (totalG <= 0) return;
        const cleanT = findCleanTotalTarget(totalG);
        doc.setFillColor(rgb[0], rgb[1], rgb[2]);
        doc.roundedRect(MARGIN, y, W - MARGIN * 2, 11, 1.5, 1.5, "F");
        doc.setTextColor(255);
        doc.setFontSize(8);
        doc.setFont(undefined, "bold");
        let totalLine = label + ": " + totalG.toLocaleString() + " g  =  " + (totalG / FULL_G).toFixed(2) + " Full  |  " + overallBatchRec(totalG);
        doc.text(totalLine, W / 2, y + 4.5, { align: "center" });
        if (cleanT && Math.abs(cleanT.diff) > 50) {
          const act = cleanT.diff < 0 ? "Reduce " + Math.abs(cleanT.diff).toLocaleString() + " g" : "Add " + cleanT.diff.toLocaleString() + " g";
          doc.setFontSize(7);
          doc.setTextColor(255, 224, 210);
          doc.text("CLEAN TARGET: " + cleanT.targetG.toLocaleString() + " g (" + cleanT.label + ") - " + act, W / 2, y + 9, { align: "center" });
        }
        y += 12;
      }


      // ===== ONE combined priority graph, with separate Pan / HC areas inside =====
      const panWithNeed = lastPanResults.filter(r => r.need > 0).slice().sort((a, b) => {
        const aLow = a.leftover < cutOfShort(a.short).c ? 0 : 1;
        const bLow = b.leftover < cutOfShort(b.short).c ? 0 : 1;
        if (aLow !== bLow) return aLow - bLow;
        return a.leftover - b.leftover || a.need - b.need;
      });
      const hcWithNeed = lastHcResults.filter(r => r.need > 0).slice().sort((a, b) => {
        const aLow = a.leftover < cutOfShort(a.short).c ? 0 : 1;
        const bLow = b.leftover < cutOfShort(b.short).c ? 0 : 1;
        if (aLow !== bLow) return aLow - bLow;
        return a.leftover - b.leftover || a.need - b.need;
      });


      // One batch sequence per group, built on the batch size picked in the app (FULL_G), plus MRD counts
      function drawSequences(withNeed, sectionTitle, headColor) {
        if (withNeed.length === 0) return;

        const batches = packIntoBatches(withNeed, 1.0); // 1.0 = the selected batch size
        const t = mrdTotals(batches);
        const tableW = W - MARGIN * 2;

        if (y > H - MARGIN - 45) { doc.addPage(); y = MARGIN; }
        doc.setFontSize(9);
        doc.setTextColor(headColor[0], headColor[1], headColor[2]);
        doc.setFont(undefined, "bold");
        doc.text(sectionTitle + " — Production Sequence (" + BATCH_M + "x batch, ~" + FULL_G.toLocaleString() + " g each)", MARGIN, y);
        y += 2.5;

        const rows = batches.map((batch, idx) => {
          const g = batch.reduce((sum, i) => sum + i.grams, 0);
          return [
            "B" + (idx + 1),
            batch.map(i => i.short + " " + i.balls + " Qty").join("  +  "),
            g.toLocaleString() + " g",
            mrdFor(batch).map(m => m.short + " x" + m.mrd).join("  +  ")
          ];
        });
        doc.autoTable({
          startY: y,
          head: [["#", "Sizes", "Grams", "MRD to print"]],
          body: rows,
          theme: "grid",
          styles: { fontSize: 6.3, cellPadding: 1, overflow: "linebreak" },
          headStyles: { fillColor: headColor, textColor: 255, fontSize: 6.3 },
          columnStyles: { 0: { cellWidth: 10 }, 1: { cellWidth: tableW - 10 - 20 - 55 }, 2: { cellWidth: 20 }, 3: { cellWidth: 55 } },
          margin: { left: MARGIN, right: MARGIN, top: MARGIN, bottom: MARGIN }
        });
        y = doc.lastAutoTable.finalY + 4;

        // MRD matrix: size x batch, then total
        if (y > H - MARGIN - 40) { doc.addPage(); y = MARGIN; }
        doc.setFontSize(8);
        doc.setTextColor(headColor[0], headColor[1], headColor[2]);
        doc.setFont(undefined, "bold");
        doc.text(sectionTitle + " — MRD count after each batch and total", MARGIN, y);
        y += 2.5;

        const perBatchTotals = batches.map((_, i) => t.rows.reduce((sum, r) => sum + r.per[i], 0));
        doc.autoTable({
          startY: y,
          head: [["Size", "Per MRD", "Pcs"].concat(batches.map((_, i) => "B" + (i + 1)), ["Total MRD"])],
          body: t.rows.map(r => [r.short, String(r.cap), String(r.pcs)].concat(r.per.map(v => v ? String(v) : "-"), [String(r.mrd)])),
          foot: [["TOTAL", "", ""].concat(perBatchTotals.map(String), [String(t.total)])],
          theme: "grid",
          styles: { fontSize: 6.3, cellPadding: 1, halign: "center" },
          headStyles: { fillColor: headColor, textColor: 255, fontSize: 6.3, halign: "center" },
          footStyles: { fillColor: [235, 235, 235], textColor: 20, fontStyle: "bold", fontSize: 6.8, halign: "center" },
          columnStyles: { 0: { halign: "left", fontStyle: "bold", cellWidth: 18 } },
          margin: { left: MARGIN, right: MARGIN, top: MARGIN, bottom: MARGIN },
          didParseCell: function(data) {
            if (data.section === "body" && data.column.index === data.table.columns.length - 1) data.cell.styles.fontStyle = "bold";
          }
        });
        y = doc.lastAutoTable.finalY + 5;
      }

      // Pan and Handcrafted are fully separate sections: own table, total, priority graph and batches
      function drawGroup(list, withNeed, tag, title, color, total, isHc) {
        if (!list.length) return;
        setGroup(isHc);
        if (y > H - MARGIN - 60) { doc.addPage(); y = MARGIN; }
        doc.setFontSize(10); doc.setTextColor(color[0], color[1], color[2]); doc.setFont(undefined, "bold");
        doc.text(title + " DOUGH", MARGIN, y); y += 2.5;
        drawTable(list, tag, color);
        drawTotalBox(total, tag + " TOTAL", isHc ? [27, 94, 32] : [26, 35, 126]);
        if (withNeed.length) {
          if (y > H - MARGIN - (25 + withNeed.length * 6.5)) { doc.addPage(); y = MARGIN; }
          y = drawCombinedPriorityGraph(doc, y, isHc ? [] : withNeed, isHc ? withNeed : [], W, MARGIN) + 3;
        }
        drawSequences(withNeed, title.toUpperCase(), color);
        y += 4;
      }
      drawGroup(lastPanResults, panWithNeed, "Pan", "Pan", [255, 107, 53], lastPanTotalG, false);
      drawGroup(lastHcResults, hcWithNeed, "HC", "Handcrafted", [46, 125, 50], lastHcTotalG, true);

      // Footer — kept inside the 1-inch bottom margin
      const footerBlockH = 4;
      let footerY = Math.min(y, H - MARGIN - footerBlockH);
      doc.setFontSize(6);
      doc.setTextColor(150);
      doc.text("Dough Calculator  |  Pan and HC are separate, never mixed  |  History on device", W / 2, footerY, { align: "center" });
      footerY += 3;


      doc.save("Dough-Production-" + now.toISOString().slice(0,10) + ".pdf");
    }

    function stepper(id, label) {
      return `<div class="fld"><label for="${id}">${label}</label><div class="step">
        <button type="button" class="sb" data-for="${id}" data-d="-1" aria-label="Decrease ${label}">−</button>
        <input type="number" id="${id}" min="0" placeholder="0" inputmode="numeric">
        <button type="button" class="sb" data-for="${id}" data-d="1" aria-label="Increase ${label}">+</button>
      </div></div>`;
    }
    const rowsHtml = list => list.map(s => `<div class="size"><div class="size-name">${s.name}</div><div class="pair">${stepper("left-" + s.key, "Leftover")}${stepper("need-" + s.key, "Projected")}</div></div>`).join("");
    $("panRows").innerHTML = rowsHtml(panSizes);
    $("hcRows").innerHTML = rowsHtml(hcSizes);
    if (location.hash) history.replaceState(null, "", location.pathname + location.search);
    $("bseg").innerHTML = BATCH_OPTIONS.map(m => `<option value="${m}">${m} ${m === 1 ? "batch (default)" : "batches"}</option>`).join("");
    setBatch(1);
    $("today").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

    document.addEventListener("click", e => {
      const b = e.target.closest(".sb");
      if (!b) return;
      const inp = $(b.dataset.for);
      const isCap = b.dataset.for.startsWith("mrdcap-"), isCut = b.dataset.for.startsWith("cut-");
      if (!isCap && !isCut) resetAdj();
      const v = Math.max(isCap || isCut ? 1 : 0, (parseInt(inp.value) || 0) + Number(b.dataset.d));
      inp.value = v || "";
      if (isCap) saveCaps();
      if (isCut) saveCuts(b.dataset.for);
      refreshUI();
      if (navigator.vibrate) navigator.vibrate(6);
    });
    document.addEventListener("input", e => { const id = e.target.id || ""; if (id.startsWith("mrdcap-")) saveCaps(); else if (id.startsWith("cut-")) saveCuts(id); else resetAdj(); refreshUI(); });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") { if ($("drawer").classList.contains("on")) closeDrawer(); else closeSheet(); }
      if (e.key === "Enter" && e.target.tagName === "INPUT" && !(e.target.id || "").startsWith("mrdcap-") && !(e.target.id || "").startsWith("cut-")) calculate();
    });
    let tx = null;
    $("drawer").addEventListener("touchstart", e => tx = e.touches[0].clientX, { passive: true });
    $("drawer").addEventListener("touchend", e => { if (tx !== null && tx - e.changedTouches[0].clientX > 60) closeDrawer(); tx = null; });
    $("seg").addEventListener("click", e => {
      const b = e.target.closest("button[data-t]");
      if (!b) return;
      const t = b.dataset.t;
      $("seg").dataset.a = t;
      $("seg").querySelectorAll("button").forEach(x => x.setAttribute("aria-selected", x === b));
      $("panel-pan").hidden = t !== "pan";
      $("panel-hc").hidden = t !== "hc";
    });
  </script>
</body>
</html>
